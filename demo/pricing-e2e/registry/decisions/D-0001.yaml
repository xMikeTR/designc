id: D-0001
status: minted           # minted | checked | bound | superseded
effect: fix             # fix (the model changes) | accept (keep the risk)
requirement: HRE-1234
binds: [Quotes DB]
resolves: [DC002]
statement: >-
  Quote writes use optimistic concurrency (rowversion) from both
  Pricing API and Referral Worker.
checks:
  - cd behaviour && p compile --pproj Quotes.pproj >/dev/null && p check -tc tcOptimistic -s 10
rationale: >-
  Two writers, no owner. Ownership would force referrals through the API;
  optimistic locking keeps them independent.
